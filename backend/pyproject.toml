[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for the Prelegal platform"
authors = [
    { name = "santhoshmurali", email = "santhoshmurali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
